<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>🎵 Music Soundboard</title>
<style>
  * { 
    margin: 0;
    padding: 0;
    box-sizing: border-box; 
  }

  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .container {
    width: 100%;
    max-width: 900px;
  }

  .header {
    text-align: center;
    color: white;
    margin-bottom: 50px;
  }

  .header h1 {
    font-size: 3.5rem;
    margin-bottom: 10px;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
  }

  .header p {
    font-size: 1.1rem;
    opacity: 0.9;
  }

  .soundboard {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 20px;
    margin-bottom: 40px;
  }

  .sound-button {
    background: rgba(255, 255, 255, 0.1);
    border: 2px solid rgba(255, 255, 255, 0.3);
    border-radius: 15px;
    padding: 30px;
    cursor: pointer;
    transition: all 0.3s ease;
    color: white;
    font-size: 2.5rem;
    font-weight: bold;
    user-select: none;
    backdrop-filter: blur(10px);
    box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
    position: relative;
    overflow: hidden;
  }

  .sound-button::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, transparent 100%);
  }

  .sound-button:hover {
    background: rgba(255, 255, 255, 0.2);
    border-color: rgba(255, 255, 255, 0.6);
    transform: translateY(-5px);
    box-shadow: 0 12px 40px rgba(31, 38, 135, 0.5);
  }

  .sound-button.active {
    background: rgba(255, 255, 255, 0.4);
    transform: scale(0.95) translateY(-2px);
    box-shadow: 0 15px 50px rgba(31, 38, 135, 0.6);
  }

  .sound-info {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .sound-key {
    font-size: 1.5rem;
    opacity: 0.8;
  }

  .sound-name {
    font-size: 0.9rem;
    opacity: 0.7;
    font-weight: normal;
  }

  .status-bar {
    background: rgba(255, 255, 255, 0.15);
    border: 2px solid rgba(255, 255, 255, 0.3);
    border-radius: 15px;
    padding: 20px;
    text-align: center;
    color: white;
    backdrop-filter: blur(10px);
    box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
  }

  .status-text {
    font-size: 1.1rem;
    font-weight: 500;
  }

  .keyboard-hint {
    text-align: center;
    color: rgba(255, 255, 255, 0.7);
    margin-top: 20px;
    font-size: 0.9rem;
  }

  @media (max-width: 600px) {
    .header h1 {
      font-size: 2.5rem;
    }

    .soundboard {
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .sound-button {
      padding: 20px;
      font-size: 2rem;
    }
  }
</style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🎵 Music Soundboard</h1>
      <p>Press keys or click buttons to play sounds</p>
    </div>

    <div class="soundboard">
      <button class="sound-button" data-key="1">
        <div class="sound-info">
          <div>1</div>
          <div class="sound-name">Magic Intro</div>
        </div>
      </button>
      <button class="sound-button" data-key="2">
        <div class="sound-info">
          <div>2</div>
          <div class="sound-name">Horror Sting</div>
        </div>
      </button>
      <button class="sound-button" data-key="3">
        <div class="sound-info">
          <div>3</div>
          <div class="sound-name">Fahh Sound</div>
        </div>
      </button>
    </div>

    <div class="status-bar">
      <div class="status-text" id="status">🎧 Ready to play</div>
      <div class="keyboard-hint">Use keyboard (1, 2, 3) or click buttons</div>
    </div>
  </div>

  <audio id="player"></audio>

  <script src="audio-mapper.js"></script>
</body>
</html>
