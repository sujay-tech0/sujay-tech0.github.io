<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>🎵 Music Soundboard</title>
<style>
  * { 
    margin: 0;
    padding: 0;
    box-sizing: border-box; 
  }

  :root {
    --primary: #667eea;
    --secondary: #764ba2;
    --light: #f0f0f0;
    --dark: #1a1a2e;
    --accent: #ff006e;
  }

  body {
    min-height: 100vh;
    background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    transition: background 0.3s ease;
  }

  body.dark-mode {
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
  }

  .container {
    width: 100%;
    max-width: 1000px;
  }

  .top-controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 30px;
    gap: 20px;
    flex-wrap: wrap;
  }

  .dark-mode-toggle {
    background: rgba(255, 255, 255, 0.2);
    border: 2px solid rgba(255, 255, 255, 0.3);
    border-radius: 50px;
    padding: 10px 20px;
    color: white;
    cursor: pointer;
    font-size: 1rem;
    transition: all 0.3s ease;
    backdrop-filter: blur(10px);
  }

  .dark-mode-toggle:hover {
    background: rgba(255, 255, 255, 0.3);
    transform: scale(1.05);
  }

  .volume-control {
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(255, 255, 255, 0.1);
    padding: 15px 20px;
    border-radius: 15px;
    backdrop-filter: blur(10px);
    border: 2px solid rgba(255, 255, 255, 0.2);
  }

  .volume-control label {
    color: white;
    font-weight: 500;
    min-width: 60px;
  }

  .volume-control input[type="range"] {
    width: 150px;
    cursor: pointer;
  }

  .volume-value {
    color: white;
    min-width: 40px;
    text-align: right;
  }

  .header {
    text-align: center;
    color: white;
    margin-bottom: 40px;
  }

  .header h1 {
    font-size: 3.5rem;
    margin-bottom: 10px;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
  }

  .header p {
    font-size: 1.1rem;
    opacity: 0.9;
  }

  .soundboard {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 20px;
    margin-bottom: 40px;
  }

  .sound-button {
    background: rgba(255, 255, 255, 0.1);
    border: 2px solid rgba(255, 255, 255, 0.3);
    border-radius: 15px;
    padding: 25px;
    cursor: pointer;
    transition: all 0.3s ease;
    color: white;
    font-size: 2.2rem;
    font-weight: bold;
    user-select: none;
    backdrop-filter: blur(10px);
    box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
  }

  .sound-button::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, transparent 100%);
  }

  .sound-button:hover {
    background: rgba(255, 255, 255, 0.2);
    border-color: rgba(255, 255, 255, 0.6);
    transform: translateY(-8px);
    box-shadow: 0 15px 50px rgba(31, 38, 135, 0.5), 0 0 30px rgba(255, 0, 110, 0.3);
  }

  .sound-button.active {
    background: rgba(255, 255, 255, 0.4);
    transform: scale(0.95) translateY(-5px);
    box-shadow: 0 20px 60px rgba(31, 38, 135, 0.7), 0 0 40px rgba(255, 0, 110, 0.5);
    animation: pulse 0.6s ease-out;
  }

  @keyframes pulse {
    0% {
      box-shadow: 0 0 0 0 rgba(255, 0, 110, 0.7);
    }
    70% {
      box-shadow: 0 0 0 20px rgba(255, 0, 110, 0);
    }
    100% {
      box-shadow: 0 0 0 0 rgba(255, 0, 110, 0);
    }
  }

  @keyframes ripple {
    0% {
      width: 0;
      height: 0;
      opacity: 1;
    }
    100% {
      width: 100px;
      height: 100px;
      opacity: 0;
    }
  }

  .sound-button.ripple::after {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    width: 100%;
    height: 100%;
    background: rgba(255, 255, 255, 0.5);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    animation: ripple 0.6s ease-out;
  }

  .sound-info {
    display: flex;
    flex-direction: column;
    gap: 6px;
    align-items: center;
    z-index: 1;
  }

  .sound-key {
    font-size: 1.2rem;
    opacity: 0.9;
  }

  .sound-name {
    font-size: 0.8rem;
    opacity: 0.8;
    font-weight: normal;
    text-align: center;
  }

  .sound-duration {
    font-size: 0.7rem;
    opacity: 0.6;
  }

  .waveform-container {
    background: rgba(255, 255, 255, 0.1);
    border: 2px solid rgba(255, 255, 255, 0.3);
    border-radius: 15px;
    padding: 20px;
    backdrop-filter: blur(10px);
    margin-bottom: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 80px;
  }

  .waveform {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 3px;
    height: 100%;
  }

  .wave-bar {
    width: 4px;
    background: linear-gradient(180deg, var(--accent), var(--primary));
    border-radius: 2px;
    animation: wave 0.6s ease-in-out infinite;
  }

  .wave-bar:nth-child(1) { animation-delay: 0s; height: 20%; }
  .wave-bar:nth-child(2) { animation-delay: 0.1s; height: 40%; }
  .wave-bar:nth-child(3) { animation-delay: 0.2s; height: 60%; }
  .wave-bar:nth-child(4) { animation-delay: 0.3s; height: 80%; }
  .wave-bar:nth-child(5) { animation-delay: 0.4s; height: 100%; }
  .wave-bar:nth-child(6) { animation-delay: 0.3s; height: 80%; }
  .wave-bar:nth-child(7) { animation-delay: 0.2s; height: 60%; }
  .wave-bar:nth-child(8) { animation-delay: 0.1s; height: 40%; }
  .wave-bar:nth-child(9) { animation-delay: 0s; height: 20%; }

  @keyframes wave {
    0%, 100% { height: 20%; }
    50% { height: 100%; }
  }

  .waveform.hidden {
    display: none;
  }

  .status-bar {
    background: rgba(255, 255, 255, 0.15);
    border: 2px solid rgba(255, 255, 255, 0.3);
    border-radius: 15px;
    padding: 20px;
    text-align: center;
    color: white;
    backdrop-filter: blur(10px);
    box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
  }

  .status-text {
    font-size: 1.1rem;
    font-weight: 500;
    margin-bottom: 10px;
  }

  .status-controls {
    display: flex;
    gap: 15px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .status-control {
    background: rgba(255, 255, 255, 0.2);
    border: 2px solid rgba(255, 255, 255, 0.3);
    border-radius: 10px;
    padding: 8px 15px;
    color: white;
    cursor: pointer;
    font-size: 0.9rem;
    transition: all 0.3s ease;
  }

  .status-control:hover {
    background: rgba(255, 255, 255, 0.3);
    transform: scale(1.05);
  }

  .status-control.active {
    background: var(--accent);
    border-color: var(--accent);
  }

  .keyboard-hint {
    text-align: center;
    color: rgba(255, 255, 255, 0.7);
    margin-top: 15px;
    font-size: 0.9rem;
  }

  @media (max-width: 600px) {
    .header h1 {
      font-size: 2.5rem;
    }

    .soundboard {
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .sound-button {
      padding: 20px;
      font-size: 1.8rem;
    }

    .top-controls {
      flex-direction: column;
    }

    .volume-control {
      width: 100%;
    }

    .waveform-container {
      height: 60px;
    }
  }
</style>
</head>
<body>
  <div class="container">
    <div class="top-controls">
      <button class="dark-mode-toggle" id="darkModeToggle">🌙 Dark Mode</button>
      <div class="volume-control">
        <label for="masterVolume">🔊 Volume:</label>
        <input type="range" id="masterVolume" min="0" max="100" value="70">
        <span class="volume-value" id="volumeValue">70%</span>
      </div>
    </div>

    <div class="header">
      <h1>🎵 Music Soundboard</h1>
      <p>Press keys or click buttons to play sounds</p>
    </div>

    <div class="waveform-container">
      <div class="waveform hidden" id="waveform">
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
      </div>
    </div>

    <div class="soundboard">
      <button class="sound-button" data-key="1" title="Press 1 or click">
        <div class="sound-info">
          <div class="sound-key">1</div>
          <div class="sound-name">Horror Sting</div>
          <div class="sound-duration">5s</div>
        </div>
      </button>
      <button class="sound-button" data-key="2" title="Press 2 or click">
        <div class="sound-info">
          <div class="sound-key">2</div>
          <div class="sound-name">Trumpet Fanfare</div>
          <div class="sound-duration">3s</div>
        </div>
      </button>
      <button class="sound-button" data-key="3" title="Press 3 or click">
        <div class="sound-info">
          <div class="sound-key">3</div>
          <div class="sound-name">Fahh Sound</div>
          <div class="sound-duration">1s</div>
        </div>
      </button>
      <button class="sound-button" data-key="4" title="Press 4 or click">
        <div class="sound-info">
          <div class="sound-key">4</div>
          <div class="sound-name">Bonus Track</div>
          <div class="sound-duration">TBD</div>
        </div>
      </button>
      <button class="sound-button" data-key="5" title="Press 5 or click">
        <div class="sound-info">
          <div class="sound-key">5</div>
          <div class="sound-name">Bonus Track</div>
          <div class="sound-duration">TBD</div>
        </div>
      </button>
      <button class="sound-button" data-key="6" title="Press 6 or click">
        <div class="sound-info">
          <div class="sound-key">6</div>
          <div class="sound-name">Bonus Track</div>
          <div class="sound-duration">TBD</div>
        </div>
      </button>
    </div>

    <div class="status-bar">
      <div class="status-text" id="status">🎧 Ready to play</div>
      <div class="status-controls">
        <button class="status-control" id="loopToggle">🔄 Loop: OFF</button>
        <button class="status-control" id="equalizerToggle">🎛️ Normal</button>
      </div>
      <div class="keyboard-hint">Press 1-6 or click buttons • Volume adjustable • Dark mode available</div>
    </div>
  </div>

  <audio id="player"></audio>

  <script src="audio-mapper.js?v=3"></script>
</body>
</html>
